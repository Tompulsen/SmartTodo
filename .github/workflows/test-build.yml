name: Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: web
        run: npm test
      - name: Type check
        working-directory: web
        run: pnpm run type-check
      - name: Build
        working-directory: web
        run: pnpm run build

  backend:
    runs-on: ubuntu-latest
    env:
      ENV: DEV
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Prepare isolated runtime directory
        run: mkdir -p data
      - name: Test planners and focus timers
        run: python -m unittest app.tests.services.planner_test app.tests.services.period_planner_test app.tests.services.focus_test -v
