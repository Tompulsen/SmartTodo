# Include inside the SmartTodo site's server block.
# Keep this upstream private and terminate HTTPS at the Baota site.
location ^~ /.well-known/acme-challenge/ {
    root /www/wwwroot/todo.zaiduyu.top;
    try_files $uri =404;
}

location = /404.html {
    internal;
    return 404;
}

location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 8m;
    proxy_intercept_errors on;
    error_page 502 504 =503 @smarttodo_unavailable;
    add_header Cache-Control "no-store" always;
}

location @smarttodo_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 300 always;
    return 503 '{"error":"SmartTodo is being prepared. Please try again later."}';
}
